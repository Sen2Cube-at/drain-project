
<link rel="stylesheet" href='{{ "css/custom.css" | relURL }}'>
<link rel="stylesheet" href='{{ "css/contribution.css" | relURL }}'>

{{ with resources.Get "images/drain_favicon.svg" }}
<link rel="icon" type="{{ .MediaType.Type }}" href="{{ .RelPermalink }}" />
<link rel="apple-touch-icon" href="{{ .RelPermalink }}" />
{{ end }}

<script>
document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll(".obfuscated-email").forEach(function (link) {
        var encoded = link.dataset.address;
        if (!encoded) return;

        var address = atob(encoded);
        link.href = "mailto:" + address;
    });

    document.querySelectorAll(".news-item__media--carousel").forEach(function (media) {
        var imgs = media.querySelectorAll(".news-item__carousel-img");
        var dots = media.querySelectorAll(".news-item__carousel-dot");
        var count = imgs.length;

        function show(index) {
            var wrapped = ((index % count) + count) % count;
            imgs.forEach(function (img) { img.classList.toggle("is-active", Number(img.dataset.index) === wrapped); });
            dots.forEach(function (dot) { dot.classList.toggle("is-active", Number(dot.dataset.index) === wrapped); });
            media.dataset.index = wrapped;
        }

        dots.forEach(function (dot) {
            dot.addEventListener("click", function (event) {
                event.stopPropagation();
                show(Number(dot.dataset.index));
            });
        });

        var justSwiped = false;

        media.addEventListener("click", function () {
            if (justSwiped) {
                justSwiped = false;
                return;
            }
            show(Number(media.dataset.index) + 1);
        });

        var touchStartX = null;
        var touchStartY = null;
        var isHorizontalSwipe = false;

        media.addEventListener("touchstart", function (event) {
            var touch = event.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
            isHorizontalSwipe = false;
        }, { passive: true });

        media.addEventListener("touchmove", function (event) {
            if (touchStartX === null) return;
            var touch = event.touches[0];
            var deltaX = touch.clientX - touchStartX;
            var deltaY = touch.clientY - touchStartY;
            if (!isHorizontalSwipe && Math.abs(deltaX) > 10 && Math.abs(deltaX) > Math.abs(deltaY)) {
                isHorizontalSwipe = true;
            }
            if (isHorizontalSwipe) {
                event.preventDefault();
            }
        }, { passive: false });

        media.addEventListener("touchend", function (event) {
            if (touchStartX === null) return;
            var touch = event.changedTouches[0];
            var deltaX = touch.clientX - touchStartX;
            if (isHorizontalSwipe && Math.abs(deltaX) > 40) {
                justSwiped = true;
                show(Number(media.dataset.index) + (deltaX < 0 ? 1 : -1));
            }
            touchStartX = null;
            touchStartY = null;
        });
    });
});
</script>
